# Tool versions for this repo. Locally: run jay-withers/toolchain's setup.sh
# once per machine, then `mise install` here. CI installs the same versions
# (jay-withers/workflows v1.26.1+), and Renovate keeps them current.

[tools]
# runs pre-commit and its Python hooks.
python = "3.14.10"
pre-commit = "4.7.0"
# actionlint lints workflow run: blocks with it, and silently skips them without it.
shellcheck = "0.11.0"
