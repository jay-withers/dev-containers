name: cd-weekly

# Weekly rebuild of the latest release so images pick up upstream base OS
# security patches. Unlike an in-place refresh, this mints a *new* patch
# version (so each version tag stays immutable/reproducible) and publishes it
# as both the new version tag and latest via cd-publish.
on:
  schedule:
    # 06:00 UTC every Monday
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  # Bump the patch version from the latest release and create a matching git
  # tag + GitHub release. The weekly job runs on the already-tagged HEAD (no
  # new commits), so we compute the bump ourselves rather than via the shared
  # release template, which only tags when there are new commits.
  tag:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Compute next patch version
        id: bump
        run: |
          latest="$(git describe --tags --abbrev=0)"
          version="${latest#v}"
          IFS=. read -r major minor patch <<< "${version}"
          next="v${major}.${minor}.$((patch + 1))"
          echo "Bumping ${latest} -> ${next}"
          echo "tag=${next}" >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.bump.outputs.tag }}"
          git tag "${tag}" "${{ github.sha }}"
          git push origin "${tag}"
          gh release create "${tag}" \
            --title "${tag}" \
            --notes "Weekly rebuild for upstream base OS security patches."

  publish:
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/cd-publish.yml
    with:
      version: ${{ needs.tag.outputs.tag }}
