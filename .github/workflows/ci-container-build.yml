name: ci-container-build

# Verifies that every image still builds and that its tools actually run, for
# each architecture we publish. Builds happen on a native runner per
# architecture (no QEMU), so the smoke tests execute real binaries rather than
# emulated ones. Root images (base, python-app) are pushed under a throwaway
# per-PR, per-arch tag purely so the leaf jobs on other runners can build FROM
# them; nothing is published under a release tag.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_REPO: ghcr.io/${{ github.repository }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.filter.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            images:
              - 'images/**'

  # Images with no parent in this repo. Each leaf below names the root it builds
  # FROM, so adding a root means adding it here and pointing its leaves at it.
  roots:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    strategy:
      fail-fast: false
      matrix:
        image: [base, python-app]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: network=host

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Loaded as well as pushed, so the smoke test below can run the image
      # here rather than pulling the tag straight back down again.
      - name: Build ${{ matrix.image }} image for linux/${{ matrix.arch }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: images/${{ matrix.image }}
          platforms: linux/${{ matrix.arch }}
          push: true
          load: true
          secrets: |
            gh_token=${{ secrets.GITHUB_TOKEN }}
          tags: ${{ env.IMAGE_REPO }}/${{ matrix.image }}:pr-${{ github.run_id }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      # The commands live in images/<name>/smoke-tests, next to the Dockerfile
      # that installs the tools, so the same checks can be run locally with
      # `make smoke-test`. Each image is tested in the job that builds it, so a
      # failure names the image that actually broke; the leaf jobs cover only
      # their own additions and never re-test any of this.
      - name: Smoke test ${{ matrix.image }} image on linux/${{ matrix.arch }}
        env:
          ARCH: ${{ matrix.arch }}
        run: ./scripts/smoke-test.sh "${{ matrix.image }}" "${{ env.IMAGE_REPO }}/${{ matrix.image }}:pr-${{ github.run_id }}-${{ matrix.arch }}"

  leaves:
    needs: roots
    if: needs.roots.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        image: [terraform, k8s, python-app-builder]
        arch: [amd64, arm64]
        # `parent` is the root image each leaf builds FROM.
        include:
          - image: terraform
            parent: base
          - image: k8s
            parent: base
          - image: python-app-builder
            parent: python-app
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: network=host

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.image }} image for linux/${{ matrix.arch }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: images/${{ matrix.image }}
          platforms: linux/${{ matrix.arch }}
          load: true
          build-args: |
            BASE_IMAGE=${{ env.IMAGE_REPO }}/${{ matrix.parent }}:pr-${{ github.run_id }}-${{ matrix.arch }}
          secrets: |
            gh_token=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ${{ env.IMAGE_REPO }}/${{ matrix.image }}:pr-${{ github.run_id }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      # Runs images/${{ matrix.image }}/smoke-tests, which lists only what this
      # image adds on top of its parent. A new image needs no change here: it is
      # picked up from its own directory.
      - name: Smoke test ${{ matrix.image }} image on linux/${{ matrix.arch }}
        env:
          ARCH: ${{ matrix.arch }}
        run: ./scripts/smoke-test.sh "${{ matrix.image }}" "${{ env.IMAGE_REPO }}/${{ matrix.image }}:pr-${{ github.run_id }}-${{ matrix.arch }}"

  # Single always-reporting job for the ruleset to mark as its required status
  # check, same shape as the shared terraform.yml workflow's gate job. `roots`/
  # `leaves` are each a single job id behind a matrix, so a failing arch leg
  # (fail-fast is off) still reports as "failure" on the job as a whole here.
  # `changes` is included too so a failure in the path filter itself — rather
  # than a legitimate skip — isn't masked by roots/leaves then reporting
  # "skipped". A docs-only PR skips roots/leaves entirely, which must still
  # count as a pass.
  ci-container-build:
    needs: [changes, roots, leaves]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify container build jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          ROOTS_RESULT: ${{ needs.roots.result }}
          LEAVES_RESULT: ${{ needs.leaves.result }}
        run: |
          echo "changes=$CHANGES_RESULT roots=$ROOTS_RESULT leaves=$LEAVES_RESULT"
          if [ "$CHANGES_RESULT" = "failure" ] || [ "$ROOTS_RESULT" = "failure" ] || [ "$LEAVES_RESULT" = "failure" ]; then
            echo "::error::A container build job failed."
            exit 1
          fi
