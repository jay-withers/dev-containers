name: ci-container-build

# Verifies that every image still builds and that its tools actually run, for
# each architecture we publish. Builds happen on a native runner per
# architecture (no QEMU), so the smoke tests execute real binaries rather than
# emulated ones. The base image is pushed under a throwaway per-PR, per-arch tag
# purely so the leaf jobs on other runners can build FROM it; nothing is
# published under a release tag.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BASE_REPO: ghcr.io/${{ github.repository }}/base

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.filter.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: |
            images:
              - 'images/**'

  base:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          driver-opts: network=host

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build base image for linux/${{ matrix.arch }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: images/base
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.BASE_REPO }}:pr-${{ github.run_id }}-${{ matrix.arch }}
          cache-from: type=gha,scope=base-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=base-${{ matrix.arch }}

  leaves:
    needs: base
    if: needs.base.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        image: [terraform, k8s]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          driver-opts: network=host

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.image }} image for linux/${{ matrix.arch }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: images/${{ matrix.image }}
          platforms: linux/${{ matrix.arch }}
          load: true
          build-args: |
            BASE_IMAGE=${{ env.BASE_REPO }}:pr-${{ github.run_id }}-${{ matrix.arch }}
          secrets: |
            gh_token=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}:pr-${{ github.run_id }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Smoke test ${{ matrix.image }} image on linux/${{ matrix.arch }}
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}:pr-${{ github.run_id }}-${{ matrix.arch }}

          # Confirm the image really is the architecture we asked for — a
          # mismatch here means an install step pulled the wrong asset.
          got="$(docker image inspect --format '{{.Architecture}}' "$IMAGE")"
          if [ "$got" != "${{ matrix.arch }}" ]; then
            echo "expected ${{ matrix.arch }} image, got ${got}" >&2
            exit 1
          fi

          if [ "${{ matrix.image }}" = "terraform" ]; then
            docker run --rm "$IMAGE" bash -c "
              az --version && \
              gh --version && \
              node --version && \
              pre-commit --version && \
              dig -v && \
              jq --version && \
              checkov --version && \
              tflint --version && \
              terraform-docs --version
            "
          else
            docker run --rm "$IMAGE" bash -c "
              az --version && \
              gh --version && \
              node --version && \
              pre-commit --version && \
              dig -v && \
              jq --version && \
              kubectl version --client && \
              helm version && \
              k9s version && \
              kubectx --version
            "
          fi
