name: cd-publish

# Builds and publishes every image to GHCR for a given tag. Invoked by cd-tag
# after a version bump, or manually to (re)publish an existing tag.
#
# Each image is built for linux/amd64 and linux/arm64 on a native runner of that
# architecture (so no QEMU emulation) and pushed by digest with no tag attached.
# A follow-up merge job then combines the per-architecture digests into a single
# multi-arch manifest list, published under both the version and latest tags.
on:
  workflow_call:
    inputs:
      version:
        description: Git tag to publish (e.g. v1.2.3)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Existing git tag to publish (e.g. v1.2.3)
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  base:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image for linux/${{ matrix.arch }}
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: images/base
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository }}/base,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=base-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=base-${{ matrix.arch }}

      # The merge job needs every architecture's digest. Artifacts are the only
      # way to get a value out of one matrix leg and into a later job, so each
      # leg writes an empty file named after its digest.
      - name: Record digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-base-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  base-merge:
    needs: base
    runs-on: ubuntu-24.04
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: digests-base-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest for base
        working-directory: /tmp/digests
        run: |
          image="${{ env.REGISTRY }}/${{ github.repository }}/base"
          refs=()
          for digest in *; do refs+=("${image}@sha256:${digest}"); done
          docker buildx imagetools create \
            --tag "${image}:${{ inputs.version }}" \
            --tag "${image}:latest" \
            "${refs[@]}"
          docker buildx imagetools inspect "${image}:${{ inputs.version }}"

  # Leaf images build FROM the freshly published multi-arch base at the same
  # version, so each native runner resolves the base for its own architecture.
  leaves:
    needs: base-merge
    strategy:
      fail-fast: false
      matrix:
        image: [terraform, k8s]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }} image for linux/${{ matrix.arch }}
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: images/${{ matrix.image }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ github.repository }}/base:${{ inputs.version }}
          secrets: |
            gh_token=${{ secrets.GITHUB_TOKEN }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Record digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  leaves-merge:
    needs: leaves
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [terraform, k8s]
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest for ${{ matrix.image }}
        working-directory: /tmp/digests
        run: |
          image="${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}"
          refs=()
          for digest in *; do refs+=("${image}@sha256:${digest}"); done
          docker buildx imagetools create \
            --tag "${image}:${{ inputs.version }}" \
            --tag "${image}:latest" \
            "${refs[@]}"
          docker buildx imagetools inspect "${image}:${{ inputs.version }}"

  # Report the vulnerabilities in what was just published. Runs last and gates
  # nothing: every image is already tagged and pullable by the time it starts,
  # so a failure here means the report failed, not the release. Scanning the
  # version tag rather than `latest` ties each report to an exact, immutable
  # artifact.
  scan:
    needs: leaves-merge
    permissions:
      contents: read
      packages: read
      issues: write
    uses: ./.github/workflows/cd-scan.yml
    with:
      tag: ${{ inputs.version }}
