name: cd-tag

on:
  push:
    branches: [main]

jobs:
  # Bump the semver tag from the conventional commits since the last release
  # (and create a matching GitHub release) via the shared release template.
  tag:
    permissions:
      contents: write
    uses: jay-withers/workflows/.github/workflows/release.yml@cbb16a01d92c2f82e5b0bb943c55ac43f43e9334 # v1.24.8

  # Publish runs as a reusable workflow so the same job can be re-triggered
  # manually (workflow_dispatch) against an existing tag if a build fails,
  # without minting a new version.
  publish:
    needs: tag
    if: needs.tag.outputs.tag != ''
    # issues: write is for the scan report cd-publish posts at the end. A
    # nested reusable workflow can only ever narrow what its caller grants, so
    # the permission has to be handed down from here.
    permissions:
      contents: read
      packages: write
      issues: write
    uses: ./.github/workflows/cd-publish.yml
    with:
      version: ${{ needs.tag.outputs.tag }}
