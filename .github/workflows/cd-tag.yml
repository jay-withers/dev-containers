name: cd-tag

on:
  push:
    branches: [main]

jobs:
  # Bump the semver tag from the conventional commits since the last release
  # (and create a matching GitHub release) via the shared release template.
  tag:
    permissions:
      contents: write
    uses: jay-withers/template-pipelines/.github/workflows/release.yml@b96bda62b383c2177603bb6cb923a6a1f56203b8 # ci/fix-cd

  # Publish runs as a reusable workflow so the same job can be re-triggered
  # manually (workflow_dispatch) against an existing tag if a build fails,
  # without minting a new version.
  publish:
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/cd-publish.yml
    with:
      version: ${{ needs.tag.outputs.tag }}
